[package]
name = "dir-aspect"
version = "0.1.2"
edition = "2024"
# Edition 2024 needs 1.85; nothing here needs more.
rust-version = "1.85"
description = "Detect what kind of application folder a directory is (Git, Obsidian, etc.)"
license = "MIT"
repository = "https://github.com/sksizer/rust-dir-aspect"
readme = "README.md"
keywords = ["directory", "detection", "git", "obsidian", "desktop"]
categories = ["filesystem"]
include = [
  "src/**/*.rs",
  "examples/**/*.rs",
  "README.md",
  "CHANGELOG.md",
  "LICENSE-MIT",
]

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde"], optional = true }

[features]
default = []
specta = ["dep:specta"]

[dev-dependencies]
serde_json = "1"

# The standard puts these in a workspace; this crate is standalone, so they
# are inline. Same values as osdlc's `[workspace.lints.rust]`.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
